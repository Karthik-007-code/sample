<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Result Management System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-body: #f3f4f6;
            --bg-card: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border: #e5e7eb;
            --success: #10b981;
            --danger: #ef4444;
            --radius: 12px;
            --transition: all 0.2s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            color: var(--primary);
            font-size: 2rem;
            font-weight: 700;
        }

        .header p {
            color: var(--text-muted);
            margin-top: 0.5rem;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 2rem;
            width: 100%;
            max-width: 1200px;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .card h2 {
            font-size: 1.25rem;
            margin-bottom: 1.5rem;
            color: var(--text-main);
            border-bottom: 2px solid var(--bg-body);
            padding-bottom: 0.5rem;
        }

        /* Form Styles */
        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--text-main);
            font-size: 0.9rem;
        }

        .form-control {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.95rem;
            transition: var(--transition);
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .marks-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
        }

        .btn {
            width: 100%;
            padding: 0.75rem;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 1rem;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn-danger {
            background-color: var(--danger);
            color: white;
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            font-size: 0.85rem;
            border: none;
            cursor: pointer;
            width: auto;
            margin-top: 0;
        }
        
        .btn-danger:hover {
            background-color: #dc2626;
        }

        /* Table Styles */
        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 1rem;
            border-bottom: 1px solid var(--border);
        }

        th {
            background-color: var(--bg-body);
            font-weight: 600;
            color: var(--text-muted);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        tbody tr:hover {
            background-color: #f9fafb;
        }

        .badge {
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .badge-success {
            background-color: #d1fae5;
            color: #065f46;
        }

        .badge-danger {
            background-color: #fee2e2;
            color: #991b1b;
        }

        .empty-state {
            text-align: center;
            padding: 2rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Student Result System</h1>
        <p>Manage and track student performance efficiently</p>
    </div>

    <div class="container">
        <!-- Form Section -->
        <div class="card">
            <h2>Add New Result</h2>
            <form id="resultForm">
                <div class="form-group">
                    <label for="studentName">Student Name</label>
                    <input type="text" id="studentName" class="form-control" required placeholder="Enter full name">
                </div>
                <div class="form-group">
                    <label for="rollNo">Roll Number</label>
                    <input type="text" id="rollNo" class="form-control" required placeholder="Enter roll number">
                </div>
                
                <div class="form-group">
                    <label>Marks (out of 100)</label>
                    <div class="marks-grid">
                        <div>
                            <input type="number" id="mathMarks" class="form-control" placeholder="Math" required min="0" max="100">
                        </div>
                        <div>
                            <input type="number" id="sciMarks" class="form-control" placeholder="Science" required min="0" max="100">
                        </div>
                        <div>
                            <input type="number" id="engMarks" class="form-control" placeholder="English" required min="0" max="100">
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn">Add Result</button>
            </form>
        </div>

        <!-- Table Section -->
        <div class="card">
            <h2>Results Dashboard</h2>
            <div class="table-container">
                <table id="resultTable">
                    <thead>
                        <tr>
                            <th>Roll No</th>
                            <th>Name</th>
                            <th>Math</th>
                            <th>Sci</th>
                            <th>Eng</th>
                            <th>Total</th>
                            <th>%</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <!-- Data will be populated here by JS -->
                    </tbody>
                </table>
                <div id="emptyState" class="empty-state">
                    No results added yet. Add a student to see data.
                </div>
            </div>
        </div>
    </div>

    <script>
        // State management
        let studentData = JSON.parse(localStorage.getItem('studentResults')) || [];

        // DOM Elements
        const form = document.getElementById('resultForm');
        const tableBody = document.getElementById('tableBody');
        const emptyState = document.getElementById('emptyState');
        const table = document.getElementById('resultTable');

        // Initialize
        function init() {
            renderTable();
        }

        // Add Result
        form.addEventListener('submit', function(e) {
            e.preventDefault();

            const name = document.getElementById('studentName').value;
            const rollNo = document.getElementById('rollNo').value;
            const math = parseInt(document.getElementById('mathMarks').value);
            const sci = parseInt(document.getElementById('sciMarks').value);
            const eng = parseInt(document.getElementById('engMarks').value);

            // Calculation
            const total = math + sci + eng;
            const percentage = (total / 300) * 100;
            const isPass = math >= 35 && sci >= 35 && eng >= 35; // Passing criteria: 35 in each subject

            const newResult = {
                id: Date.now(),
                name,
                rollNo,
                math,
                sci,
                eng,
                total,
                percentage: percentage.toFixed(2),
                isPass
            };

            studentData.push(newResult);
            saveData();
            renderTable();
            form.reset();
        });

        // Delete Result
        function deleteResult(id) {
            if(confirm('Are you sure you want to delete this result?')) {
                studentData = studentData.filter(student => student.id !== id);
                saveData();
                renderTable();
            }
        }

        // Save to Local Storage
        function saveData() {
            localStorage.setItem('studentResults', JSON.stringify(studentData));
        }

        // Render Table
        function renderTable() {
            if (studentData.length === 0) {
                table.style.display = 'none';
                emptyState.style.display = 'block';
                return;
            }

            table.style.display = 'table';
            emptyState.style.display = 'none';
            tableBody.innerHTML = '';

            studentData.forEach(student => {
                const statusBadge = student.isPass 
                    ? '<span class="badge badge-success">PASS</span>' 
                    : '<span class="badge badge-danger">FAIL</span>';

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><strong>${student.rollNo}</strong></td>
                    <td>${student.name}</td>
                    <td>${student.math}</td>
                    <td>${student.sci}</td>
                    <td>${student.eng}</td>
                    <td><strong>${student.total}</strong>/300</td>
                    <td>${student.percentage}%</td>
                    <td>${statusBadge}</td>
                    <td>
                        <button class="btn-danger" onclick="deleteResult(${student.id})">Delete</button>
                    </td>
                `;
                tableBody.appendChild(row);
            });
        }

        // Run init
        init();
    </script>
</body>
</html>
