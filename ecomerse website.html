<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ModernStore | Simple E-Commerce</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #090d16;
            --card-bg: rgba(22, 30, 46, 0.75);
            --card-hover: rgba(30, 41, 64, 0.9);
            --border-color: rgba(255, 255, 255, 0.08);
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --accent: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --radius: 16px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Header & Navigation */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(9, 13, 22, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
        }

        .nav-container {
            max-width: 1280px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1.5rem;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #818cf8 0%, #c084fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
        }

        .search-box {
            flex: 1;
            max-width: 450px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 0.7rem 1.2rem 0.7rem 2.8rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 99px;
            color: var(--text-main);
            font-size: 0.9rem;
            outline: none;
            transition: var(--transition);
        }

        .search-box input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
            background: rgba(255, 255, 255, 0.08);
        }

        .search-box svg {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            stroke: var(--text-muted);
        }

        .cart-btn {
            position: relative;
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(99, 102, 241, 0.3);
            color: var(--text-main);
            padding: 0.65rem 1.2rem;
            border-radius: 99px;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .cart-btn:hover {
            background: var(--primary);
            border-color: var(--primary);
            transform: translateY(-1px);
        }

        .cart-badge {
            background: #ef4444;
            color: white;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 0.15rem 0.5rem;
            border-radius: 99px;
        }

        /* Hero Banner */
        .hero {
            max-width: 1280px;
            margin: 2rem auto 1rem;
            padding: 2.5rem 2rem;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.2) 0%, rgba(168, 85, 247, 0.15) 100%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            width: calc(100% - 4rem);
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .hero h1 {
            font-size: 2.2rem;
            font-weight: 800;
            line-height: 1.2;
        }

        .hero p {
            color: var(--text-muted);
            font-size: 1rem;
            max-width: 600px;
        }

        /* Category Filter Bar */
        .categories-bar {
            max-width: 1280px;
            margin: 1.5rem auto 1rem;
            padding: 0 2rem;
            display: flex;
            gap: 0.6rem;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .categories-bar::-webkit-scrollbar {
            display: none;
        }

        .cat-pill {
            padding: 0.5rem 1.1rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 99px;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: var(--transition);
        }

        .cat-pill.active, .cat-pill:hover {
            background: var(--primary);
            border-color: var(--primary);
            color: #ffffff;
        }

        /* Main Container & Product Grid */
        main {
            max-width: 1280px;
            margin: 0 auto;
            padding: 1rem 2rem 4rem;
            flex: 1;
            width: 100%;
        }

        .products-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .products-header h2 {
            font-size: 1.4rem;
            font-weight: 700;
        }

        .product-count {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1.5rem;
        }

        /* Product Card */
        .product-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .product-card:hover {
            background: var(--card-hover);
            transform: translateY(-4px);
            border-color: rgba(99, 102, 241, 0.3);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
        }

        .img-wrapper {
            width: 100%;
            height: 200px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin-bottom: 1rem;
            position: relative;
        }

        .img-wrapper img {
            max-width: 85%;
            max-height: 85%;
            object-fit: contain;
            transition: var(--transition);
        }

        .product-card:hover .img-wrapper img {
            transform: scale(1.08);
        }

        .discount-badge {
            position: absolute;
            top: 0.75rem;
            left: 0.75rem;
            background: #ef4444;
            color: white;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 0.25rem 0.5rem;
            border-radius: 6px;
        }

        .rating-badge {
            position: absolute;
            top: 0.75rem;
            right: 0.75rem;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            color: #fbbf24;
            font-size: 0.78rem;
            font-weight: 700;
            padding: 0.25rem 0.5rem;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 0.2rem;
        }

        .product-category {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--primary);
            font-weight: 700;
            margin-bottom: 0.3rem;
        }

        .product-title {
            font-size: 1rem;
            font-weight: 700;
            line-height: 1.3;
            margin-bottom: 0.5rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .product-desc {
            font-size: 0.82rem;
            color: var(--text-muted);
            margin-bottom: 1rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .price-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: auto;
            padding-top: 0.8rem;
            border-top: 1px solid var(--border-color);
        }

        .price {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--text-main);
        }

        .add-cart-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.6rem 1rem;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .add-cart-btn:hover {
            background: var(--primary-hover);
        }

        /* Cart Side Drawer */
        .cart-drawer-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .cart-drawer-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .cart-drawer {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            max-width: 420px;
            background: #0f172a;
            border-left: 1px solid var(--border-color);
            z-index: 201;
            transform: translateX(100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
        }

        .cart-drawer-overlay.open .cart-drawer {
            transform: translateX(0);
        }

        .drawer-header {
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .drawer-header h3 {
            font-size: 1.2rem;
            font-weight: 700;
        }

        .close-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 0.4rem;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-btn:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.08);
        }

        .cart-items-container {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .empty-cart {
            text-align: center;
            color: var(--text-muted);
            margin: auto 0;
            font-size: 0.95rem;
        }

        .cart-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            padding: 0.8rem;
            border-radius: 12px;
        }

        .cart-item img {
            width: 55px;
            height: 55px;
            object-fit: contain;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
        }

        .cart-item-details {
            flex: 1;
        }

        .cart-item-title {
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 0.2rem;
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .cart-item-price {
            font-size: 0.85rem;
            color: var(--accent);
            font-weight: 700;
        }

        .cart-item-actions {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 0.4rem;
        }

        .qty-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: var(--text-main);
            width: 24px;
            height: 24px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
        }

        .qty-btn:hover {
            background: var(--primary);
        }

        .drawer-footer {
            padding: 1.5rem;
            border-top: 1px solid var(--border-color);
            background: rgba(15, 23, 42, 0.8);
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }

        .checkout-btn {
            width: 100%;
            padding: 0.9rem;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
        }

        .checkout-btn:hover {
            background: #059669;
        }

        /* Toast Feedback */
        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #10b981;
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 99px;
            font-weight: 600;
            font-size: 0.9rem;
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 300;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        /* Loading Skeleton */
        .skeleton {
            background: linear-gradient(90deg, rgba(255,255,255,0.03) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.03) 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
            border-radius: 8px;
        }

        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <header>
        <div class="nav-container">
            <a href="#" class="logo">
                ⚡ ModernStore
            </a>

            <!-- Search Bar -->
            <div class="search-box">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" />
                </svg>
                <input type="text" id="searchInput" placeholder="Search products, brands, or categories...">
            </div>

            <!-- Cart Trigger Button -->
            <button class="cart-btn" onclick="toggleCart()">
                🛒 Cart
                <span class="cart-badge" id="cartBadge">0</span>
            </button>
        </div>
    </header>

    <!-- Hero Banner -->
    <section class="hero">
        <h1>Discover Top Quality Products</h1>
        <p>Explore hot deals, trending electronics, beauty essentials, and accessories directly fetched from the DummyJSON API.</p>
    </section>

    <!-- Category Filter Bar -->
    <div class="categories-bar" id="categoryBar">
        <button class="cat-pill active" onclick="filterCategory('all', this)">All Products</button>
    </div>

    <!-- Main Content Grid -->
    <main>
        <div class="products-header">
            <h2>Featured Products</h2>
            <span class="product-count" id="productCount">Loading...</span>
        </div>

        <div class="products-grid" id="productsGrid">
            <!-- Loading Skeletons -->
            <div class="product-card" style="height: 380px;">
                <div class="skeleton" style="height: 200px; margin-bottom: 1rem;"></div>
                <div class="skeleton" style="height: 20px; width: 60%; margin-bottom: 0.5rem;"></div>
                <div class="skeleton" style="height: 16px; width: 90%; margin-bottom: 1rem;"></div>
                <div class="skeleton" style="height: 36px;"></div>
            </div>
            <div class="product-card" style="height: 380px;">
                <div class="skeleton" style="height: 200px; margin-bottom: 1rem;"></div>
                <div class="skeleton" style="height: 20px; width: 60%; margin-bottom: 0.5rem;"></div>
                <div class="skeleton" style="height: 16px; width: 90%; margin-bottom: 1rem;"></div>
                <div class="skeleton" style="height: 36px;"></div>
            </div>
            <div class="product-card" style="height: 380px;">
                <div class="skeleton" style="height: 200px; margin-bottom: 1rem;"></div>
                <div class="skeleton" style="height: 20px; width: 60%; margin-bottom: 0.5rem;"></div>
                <div class="skeleton" style="height: 16px; width: 90%; margin-bottom: 1rem;"></div>
                <div class="skeleton" style="height: 36px;"></div>
            </div>
        </div>
    </main>

    <!-- Cart Side Drawer Overlay -->
    <div class="cart-drawer-overlay" id="cartOverlay" onclick="closeCartOnOverlay(event)">
        <div class="cart-drawer">
            <div class="drawer-header">
                <h3>Shopping Cart</h3>
                <button class="close-btn" onclick="toggleCart()">✕</button>
            </div>

            <div class="cart-items-container" id="cartItemsContainer">
                <div class="empty-cart">Your cart is currently empty.</div>
            </div>

            <div class="drawer-footer">
                <div class="total-row">
                    <span>Total Amount:</span>
                    <span id="cartTotal">$0.00</span>
                </div>
                <button class="checkout-btn" onclick="checkout()">Proceed to Checkout</button>
            </div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div class="toast" id="toast">Item added to cart!</div>

    <script>
        let allProducts = [];
        let cart = [];
        let selectedCategory = 'all';

        // Fetch products from API
        async function fetchProducts() {
            try {
                const response = await fetch('https://dummyjson.com/products');
                const data = await response.json();
                allProducts = data.products;
                
                renderCategories(allProducts);
                renderProducts(allProducts);
            } catch (error) {
                console.error("Failed to fetch products:", error);
                document.getElementById('productsGrid').innerHTML = `
                    <div style="grid-column: 1/-1; text-align: center; color: #ef4444; padding: 2rem;">
                        Failed to load products. Please check your internet connection.
                    </div>
                `;
            }
        }

        // Extract and Render Category Pills
        function renderCategories(products) {
            const categories = ['all', ...new Set(products.map(p => p.category))];
            const categoryBar = document.getElementById('categoryBar');
            
            categoryBar.innerHTML = categories.map(cat => `
                <button class="cat-pill ${cat === 'all' ? 'active' : ''}" 
                        onclick="filterCategory('${cat}', this)">
                    ${cat.charAt(0).toUpperCase() + cat.slice(1)}
                </button>
            `).join('');
        }

        // Render Product Cards Grid
        function renderProducts(products) {
            const grid = document.getElementById('productsGrid');
            const countLabel = document.getElementById('productCount');
            
            countLabel.textContent = `Showing ${products.length} products`;

            if (products.length === 0) {
                grid.innerHTML = `
                    <div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 3rem;">
                        No products found matching your criteria.
                    </div>
                `;
                return;
            }

            grid.innerHTML = products.map(product => `
                <div class="product-card">
                    <div>
                        <div class="img-wrapper">
                            <span class="discount-badge">-${Math.round(product.discountPercentage)}%</span>
                            <span class="rating-badge">⭐ ${product.rating}</span>
                            <img src="${product.thumbnail}" alt="${product.title}" loading="lazy" onerror="this.src='https://via.placeholder.com/200?text=No+Image'">
                        </div>
                        <div class="product-category">${product.category}</div>
                        <h3 class="product-title" title="${product.title}">${product.title}</h3>
                        <p class="product-desc">${product.description}</p>
                    </div>

                    <div class="price-row">
                        <div class="price">$${product.price}</div>
                        <button class="add-cart-btn" onclick="addToCart(${product.id})">
                            + Add to Cart
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // Category Filter Function
        function filterCategory(category, element) {
            selectedCategory = category;
            
            // Update active pill state
            document.querySelectorAll('.cat-pill').forEach(pill => pill.classList.remove('active'));
            element.classList.add('active');

            applyFilters();
        }

        // Search Input Filter
        document.getElementById('searchInput').addEventListener('input', () => {
            applyFilters();
        });

        // Combined Filter Function
        function applyFilters() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();

            const filtered = allProducts.filter(product => {
                const matchesCategory = selectedCategory === 'all' || product.category === selectedCategory;
                const matchesSearch = product.title.toLowerCase().includes(searchTerm) || 
                                      product.description.toLowerCase().includes(searchTerm) ||
                                      product.category.toLowerCase().includes(searchTerm);

                return matchesCategory && matchesSearch;
            });

            renderProducts(filtered);
        }

        // Add Product to Cart
        function addToCart(productId) {
            const product = allProducts.find(p => p.id === productId);
            if (!product) return;

            const existingItem = cart.find(item => item.id === productId);
            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push({ ...product, quantity: 1 });
            }

            updateCartUI();
            showToast(`Added "${product.title}" to cart`);
        }

        // Update Cart Drawer UI & Counter
        function updateCartUI() {
            const cartBadge = document.getElementById('cartBadge');
            const cartContainer = document.getElementById('cartItemsContainer');
            const cartTotal = document.getElementById('cartTotal');

            const totalItems = cart.reduce((acc, item) => acc + item.quantity, 0);
            const totalPrice = cart.reduce((acc, item) => acc + (item.price * item.quantity), 0);

            cartBadge.textContent = totalItems;
            cartTotal.textContent = `$${totalPrice.toFixed(2)}`;

            if (cart.length === 0) {
                cartContainer.innerHTML = `<div class="empty-cart">Your cart is currently empty.</div>`;
                return;
            }

            cartContainer.innerHTML = cart.map(item => `
                <div class="cart-item">
                    <img src="${item.thumbnail}" alt="${item.title}">
                    <div class="cart-item-details">
                        <div class="cart-item-title">${item.title}</div>
                        <div class="cart-item-price">$${(item.price * item.quantity).toFixed(2)}</div>
                        <div class="cart-item-actions">
                            <button class="qty-btn" onclick="changeQty(${item.id}, -1)">-</button>
                            <span style="font-size:0.85rem; font-weight:600;">${item.quantity}</span>
                            <button class="qty-btn" onclick="changeQty(${item.id}, 1)">+</button>
                            <button onclick="removeFromCart(${item.id})" style="background:none; border:none; color:#ef4444; margin-left:auto; cursor:pointer; font-size:0.8rem;">Remove</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Quantity Change
        function changeQty(productId, delta) {
            const item = cart.find(i => i.id === productId);
            if (!item) return;

            item.quantity += delta;
            if (item.quantity <= 0) {
                cart = cart.filter(i => i.id !== productId);
            }
            updateCartUI();
        }

        // Remove from Cart
        function removeFromCart(productId) {
            cart = cart.filter(i => i.id !== productId);
            updateCartUI();
        }

        // Toggle Cart Drawer
        function toggleCart() {
            const overlay = document.getElementById('cartOverlay');
            overlay.classList.toggle('open');
        }

        function closeCartOnOverlay(event) {
            if (event.target.id === 'cartOverlay') {
                toggleCart();
            }
        }

        // Toast Feedback Notice
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        // Checkout Simulation
        function checkout() {
            if (cart.length === 0) {
                alert("Your cart is empty!");
                return;
            }
            alert("Thank you for your order! Processing payment...");
            cart = [];
            updateCartUI();
            toggleCart();
        }

        // Initial Load
        fetchProducts();
    </script>
</body>
</html>
