<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Selectors</title>
    <style>
        h1 {
            color: blue;
        }

        .cls {
            color: green;
        }

        #id {
            color: orange;
        }

        p:hover {
            color: purple;
        }

        h2,
        h3 {
            color: red;
        }

        ul li {
            color: coral;
        }
    </style>
</head>

<body>

    <h1>Element Selector (h1)</h1>

    <p class="cls">Class Selector </p>

    <p id="id">ID Selector </p>
    <ul>
        <li>
            <p>decendent selector</p>
        </li>
        <li>
            <p>yoooo</p>
        </li>
        <li>
            <p>yoooo</p>
        </li>
        <li>
            <p>yoooo</p>
        </li>
        <li>
            <p>yoooo</p>
        </li>
    </ul>

    <p>Pseudo Selector (Hover over this text)</p>


    <h2>Multi-Element Selector (h2)</h2>
    <h3>Multi-Element Selector (h3)</h3>

</body>

</html>
